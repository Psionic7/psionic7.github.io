name: Collect data and deploy Pages
on:
  push:
    branches: [main]
    paths-ignore: ['project-notes/**']
  schedule:
    - cron: '15 22 * * *' # collection-schedule
  workflow_dispatch:
    inputs:
      collect:
        description: '실거래 및 새 도로명주소 수집 (해제하면 최신 저장 DB로 재배포)'
        type: boolean
        default: true
      recent_months:
        description: '이번 실행의 최근 개월 수 (빈 값이면 저장 설정)'
        type: string
        default: ''

concurrency:
  group: home-records-publishing
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile
      - name: Restore encrypted working database
        run: node scripts/automation.mjs restore
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COLLECTION_STATE_KEY: ${{ secrets.COLLECTION_STATE_KEY }}
      - name: Collect saved regions and new road addresses
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.collect)
        run: node scripts/automation.mjs collect
        env:
          MOLIT_SERVICE_KEY: ${{ secrets.MOLIT_SERVICE_KEY }}
          JUSO_ADDRESS_SEARCH_KEY: ${{ secrets.JUSO_ADDRESS_SEARCH_KEY }}
          INPUT_RECENT_MONTHS: ${{ inputs.recent_months }}
      - name: Export public data
        run: node scripts/automation.mjs export
        env:
          MOLIT_SERVICE_KEY: ${{ secrets.MOLIT_SERVICE_KEY }}
          JUSO_ADDRESS_SEARCH_KEY: ${{ secrets.JUSO_ADDRESS_SEARCH_KEY }}
      - name: Build and check public files
        run: |
          pnpm build
          pnpm check:publish
        env:
          MOLIT_SERVICE_KEY: ${{ secrets.MOLIT_SERVICE_KEY }}
          JUSO_ADDRESS_SEARCH_KEY: ${{ secrets.JUSO_ADDRESS_SEARCH_KEY }}
      - name: Preserve collected working database
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.collect)
        run: node scripts/automation.mjs save
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COLLECTION_STATE_KEY: ${{ secrets.COLLECTION_STATE_KEY }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
