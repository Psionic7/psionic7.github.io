name: Verify unattended Naver sale collection
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/naver-listings-smoke.yml'
      - 'scripts/naver-system-chrome.py'
      - 'scripts/check-naver-live.mjs'
      - 'scripts/requirements-naver-browser.txt'
      - 'server/naver-system-chrome.mjs'
      - 'server/naver-listing-source.mjs'
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            chrome: /usr/bin/google-chrome
          - os: windows-2025
            chrome: C:\Program Files\Google\Chrome\Application\chrome.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      NAVER_BROWSER_PYTHON: python
      NAVER_CHROME_PATH: ${{ matrix.chrome }}
      NAVER_BROWSER_DIAGNOSTICS: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-naver-browser.txt
      - run: python -m pip install -r scripts/requirements-naver-browser.txt
      - name: Verify Chrome and virtual display
        run: |
          python -c "import os; from pathlib import Path; p=Path(os.environ['NAVER_CHROME_PATH']); print(p); assert p.is_file()"
          if [[ "$RUNNER_OS" == "Linux" ]]; then google-chrome --version; command -v xvfb-run; fi
      - name: Test Python IPC, browser search and every-page coverage
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run --auto-servernum --server-args='-screen 0 1280x1000x24' node --test tests/naver-system-chrome.test.mjs tests/naver-nodriver.integration.mjs
          else
            node --test tests/naver-system-chrome.test.mjs tests/naver-nodriver.integration.mjs
          fi
      - name: Collect real sale listings by known ID and automatic search
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run --auto-servernum --server-args='-screen 0 1280x1000x24' node scripts/check-naver-live.mjs
          else
            node scripts/check-naver-live.mjs
          fi
        env:
          NAVER_LISTING_SOURCE: system-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: naver-live-validation-${{ runner.os }}
          path: local/data-validation/naver-live.json
          if-no-files-found: warn
          retention-days: 14
