name: Deploy GitHub admin login
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-admin-portal
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile
      - name: Test authentication
        run: node --test tests/admin-auth.test.mjs
      - name: Build administrator UI
        run: pnpm admin:portal:build
      - name: Configure administrator server
        run: node scripts/configure-admin-portal.mjs
        env:
          ADMIN_ORIGIN: ${{ vars.ADMIN_PORTAL_URL }}
          GITHUB_OAUTH_CLIENT_ID: ${{ vars.GITHUB_OAUTH_CLIENT_ID }}
      - name: Deploy administrator server and secrets
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.136.3"
          workingDirectory: auth-admin
          command: deploy --config wrangler.deploy.json
          secrets: |
            GITHUB_ADMIN_TOKEN
            GITHUB_OAUTH_CLIENT_SECRET
        env:
          GITHUB_ADMIN_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN }}
          GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.GITHUB_OAUTH_CLIENT_SECRET }}
